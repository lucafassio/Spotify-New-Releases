<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Spotify New Releases{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.4" crossorigin="anonymous"></script>
  <style>
    /* tokens de docs/design/style-guide.md */
    :root {
      --negro: #000000;
      --superficie: #141414;
      --elevada: #1E1E1E;
      --linea: #262626;
      --texto: #F5F5F2;
      --texto-2: #A7A9A4;
      --verde: #1ED760;
    }
    body {
      margin: 0;
      background: var(--negro);
      color: var(--texto);
      font-family: 'Figtree', sans-serif;
    }
    h1 {
      font-family: 'Archivo', sans-serif;
      font-stretch: 75%;
      font-weight: 900;
    }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
