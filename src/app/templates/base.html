<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Radar de Viernes{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-title" content="Radar">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ static_url('app.css') }}">
  <!-- defer: htmx y las extensiones no frenan el primer pintado y corren en orden antes de DOMContentLoaded -->
  <script src="{{ static_url('htmx-2.0.4.min.js') }}" defer></script>
  <!-- morph en vez de reemplazo: los paneles conservan su scroll despues de cada accion -->
  <script src="{{ static_url('idiomorph-ext-0.8.0.min.js') }}" defer></script>
  <script src="{{ static_url('htmx-ext-preload-2.1.0.js') }}" defer></script>
  <script src="{{ static_url('app.js') }}" defer></script>
  <script src="{{ static_url('navegacion.js') }}" defer></script>
  <!-- scripts propios extra: una linea por archivo aca abajo, con static_url('archivo.js') y defer; corren despues de app.js en este orden -->
  <!-- fin de scripts propios extra -->
  <style>
    {% block style %}{% endblock %}
  </style>
</head>
<body {% block body_attrs %}{% endblock %}>
  {% block content %}{% endblock %}
</body>
</html>
