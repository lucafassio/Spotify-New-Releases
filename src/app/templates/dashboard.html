{% extends 'shell.html' %}

{% block panel %}
<section class="panel main" data-n="Panel">
  <header class="head" data-n="Cabecera de Inicio"><div class="grow"><span class="eyebrow">Tu biblioteca</span><h1>Hola, {{ display_name }}</h1></div></header>
  {% include '_avisos.html' %}
  <div class="vacio">
    {% if canales %}
    <p class="muted">Elegi un Canal de la izquierda para ver de quien trae novedades y a que playlist.</p>
    {% else %}
    <p class="muted">Todavia no tenes Canales.</p>
    <a class="btn primario" href="/canales/nuevo">Crear un Canal</a>
    {% endif %}
  </div>
</section>
{% endblock %}
