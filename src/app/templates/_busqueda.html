{% import '_macros.html' as ui %}
{% if notice %}
<div class="aviso warn" data-n="Aviso de busqueda" role="status">{{ notice }}</div>
{% elif query and results %}
<div class="results">
  {% for artist in results %}{{ ui.search_result(canal.id, artist) }}{% endfor %}
</div>
{% elif query %}
<small>No encontre "{{ query }}".</small>
{% endif %}
