const APAR = { "Bad Bunny": 94, "Myke Towers": 67, "Mora": 46, "Romeo Santos": 35, "Duki": 35, "Eladio Carrion": 34, "Anuel AA": 34, "Omar Courtz": 32, "Rauw Alejandro": 30, "Daddy Yankee": 29, "YSY A": 29, "Ozuna": 27, "ROA": 25, "Justin Quiles": 24, "Quevedo": 24, "J Balvin": 21, "Prince Royce": 19, "Aventura": 19, "Wisin & Yandel": 18, "Pablo Alboran": 18, "Alejandro Sanz": 18, "Plan B": 16, "Arcangel": 15, "Bizarrap": 15, "Dei V": 15, "3AM": 14, "Alex Rose": 13, "Maluma": 12, "Hira": 12, "YOVNGCHIMI": 11, "JHAYCO": 10, "Santy-P": 9, "Abel Pintos": 8, "Panther": 7, "Dalex": 5, "Lucho SSJ": 5, "Morat": 5, "Jesse & Joy": 5 };
const OTROS = ["Beny Jr", "Elpatron970", "Alejo", "Nicky Jam", "Bryant Myers", "JC Reyes", "Jay Wheeler", "Sech", "De La Rose", "Don Omar", "Luar La L", "Neo Pistea", "Ryan Castro", "Bad Gyal", "Tainy", "Fazzini"];
const ARTISTS = [...new Set([...PLAYLISTS.flatMap(p => p.top), ...Object.keys(APAR), ...OTROS])].sort();
const apar = n => APAR[n] ?? 3;
// pares de playlists que se pisan (comparacion de artistas principales y primeros temas)
const GEMELAS = [
  { a: "p3", b: null, bNombre: "\u{1F360}", comp: 6, nota: "Arrancan con los mismos temas y comparten sus 6 artistas principales." },
  { a: "p12", b: "p11", comp: 6, nota: "Mismos 6 artistas principales y varios temas repetidos." },
  { a: "p7", b: "p6", comp: 3, nota: "Los primeros temas se repiten; comparten 3 de 6 artistas principales." },
  { a: "p5", b: "p8", comp: 3, nota: "Comparten 3 de 6 artistas principales y algunos temas." },
];
const REDIRECT = "https://spotify-new-releases.onrender.com/callback";

// ---------- helpers ----------
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const P = id => PLAYLISTS.find(p => p.id === id);
const hue = s => { let h = 7; for (const ch of String(s)) h = (h * 131 + ch.codePointAt(0) * 17) % 360; return h; };
const initial = s => { const m = String(s).match(/[A-Za-z0-9]/); return m ? m[0].toUpperCase() : [...String(s)][0] || "#"; };
const cover = (name, size, h) => `<div class="cover" style="--h:${h ?? hue(name)};width:${size}px;height:${size}px"><span style="font-size:${Math.round(size * .62)}px">${esc(initial(name))}</span></div>`;
const avatar = (name, size = 24) => `<span class="avatar" style="--h:${hue(name)};width:${size}px;height:${size}px;font-size:${Math.round(size * .42)}px">${esc(initial(name))}</span>`;
const sw = (on, act, attrs = "", n = "Interruptor") => `<button class="sw" role="switch" aria-checked="${on}" data-act="${act}" ${attrs} data-n="${n}"></button>`;

let seq = 3;
const S = {
  user: null, sim: "registrado", screen: "login", own: { cid: "", secret: "" },
  canales: [], followed: new Set(), hidden: new Set(),
  ui: { view: "canal", sel: "c1", names: false, debug: false, open: new Set(["p7"]), confirm: false, flash: null },
};
const C = id => S.canales.find(c => c.id === id);
const nombre = c => c.target.nombre || "Sin nombre";
const cur = () => C(S.ui.sel);

// Whitelist aproximada: follows + artistas de cada Seed Playlist (+ feats) - excluidos + a mano
function whitelist(c) {
  let n = c.follows ? S.followed.size : 0;
  c.seeds.forEach(s => { const p = P(s.pid); n += p.artistas + (s.feats ? p.feats : 0) - (c.excl[s.pid]?.length || 0); });
  return n + c.manual.length;
}
function incluidos(c) {
  const set = new Set(c.manual);
  if (c.follows) S.followed.forEach(a => set.add(a));
  c.seeds.forEach(s => P(s.pid).top.forEach(a => { if (!(c.excl[s.pid] || []).includes(a)) set.add(a); }));
  return set;
}
function retText(c) {
  if (c.target.kind === "existing" || c.retencion === "acum") return "guarda todo";
  return c.retencion === 1 ? "se renueva cada semana" : `guarda ${c.retencion} semanas`;
}
const cap = c => c.target.kind === "existing" ? P(c.target.pid).items : c.items;
function capMeter(c) {
  const n = cap(c), pct = Math.min(100, n / 100);
  if (pct < 90) return "";
  return `<div class="stack" style="gap:6px" data-n="Medidor de tope"><div class="meter ${pct >= 95 ? "crit" : "warn"}"><i style="width:${pct}%"></i></div>
    <small class="nums">${n.toLocaleString("es-AR")} de 10.000 canciones. Lo que no entre no se agrega.</small></div>`;
}
function bars(list, max, n = "Barras") {
  return `<div class="bars" data-n="${n}">${list.map(([name, v, dim]) => `<div class="bar ${dim ? "dim" : ""}"><span class="ellip">${esc(name)}</span><span class="track"><i style="width:${Math.max(4, v / max * 100)}%"></i></span><span class="nums">${v}</span></div>`).join("")}</div>`;
}

// ---------- barra lateral ----------
function side() {
  const v = S.ui.view;
  return `<aside class="panel side" data-n="Barra lateral">

    <div class="stack" style="gap:0;min-height:0" data-n="Lista de Canales">

      <div class="side-list scroll">${S.canales.map(k => `<button class="nav-row ${v === "canal" && k.id === S.ui.sel ? "on" : ""}" data-act="sel" data-c="${k.id}" data-n="Fila de Canal">${cover(nombre(k), 40, k.hue)}
        <span class="grow"><span class="nm ellip">${esc(nombre(k))}</span><small class="nums">~${whitelist(k)} artistas</small></span></button>`).join("")}</div>
    </div>
    <div class="perfil" data-n="Perfil">${avatar(PERFIL.nombre, 32)}<div class="grow"><b>${esc(PERFIL.nombre)}</b><br><small>@${esc(PERFIL.handle)}</small></div><button class="btn fantasma chico" data-act="logout">Salir</button></div>
  </aside>`;
}

// ---------- Canal: tres columnas ----------
function colFuentes(c) {
  const rows = PLAYLISTS.map(p => {
    const ok = p.tipo !== "ajena", s = c.seeds.find(x => x.pid === p.id), on = !!s, open = S.ui.open.has(p.id);
    const excl = c.excl[p.id] || [];
    const other = S.canales.find(k => k.target.pid === p.id);
    const meta = !ok ? `de ${esc(p.duenio)}, Spotify no deja usarla` : `${p.artistas} artistas${on && excl.length ? ` &middot; ${excl.length} sacado${excl.length > 1 ? "s" : ""}` : ""}${other ? ` &middot; es la playlist de "${esc(nombre(other))}"` : ""}`;
    const chips = p.top.map(a => {
      const fuera = excl.includes(a);
      return on ? `<button class="achip ${fuera ? "fuera" : ""}" data-act="excl" data-p="${p.id}" data-a="${esc(a)}" aria-pressed="${!fuera}" title="${fuera ? "Volver a sumar" : "Sacar de este Canal"}" data-n="Ficha de artista">${avatar(a, 22)}${esc(a)}</button>`
        : `<span class="achip fija" data-n="Ficha de artista">${avatar(a, 22)}${esc(a)}</span>`;
    }).join("");
    return `<div class="pl ${on ? "on" : ""} ${ok ? "" : "off"}" data-n="Fila de Seed Playlist">
      <div class="pl-row">${sw(on, "seed", `data-p="${p.id}" ${ok ? "" : "disabled"}`, "Interruptor de playlist")}${cover(p.nombre, 40, hue(p.id))}
        <span class="grow"><span class="nm ellip">${esc(p.nombre)}</span><small class="nums">${meta}</small></span>
        <button class="chev" data-act="expand" data-p="${p.id}" aria-expanded="${open}" aria-label="Ver artistas" data-n="Boton ver artistas">&rsaquo;</button></div>
      ${open ? `<div class="pl-art" data-n="Artistas de la playlist"><div class="chips">${chips}<span class="mas nums">+${p.artistas - p.top.length} mas</span></div>
        ${on ? `<small>Toca un artista para sacarlo de este Canal.</small>
        <div class="row" data-n="Interruptor Feats">${sw(s.feats, "feats", `data-p="${p.id}"`)}<span class="grow">Sumar tambien los invitados (feats)</span><small class="nums">+${p.feats}</small></div>` : ""}</div>` : ""}
    </div>`;
  }).join("");
  return `<section class="col" data-n="Columna Fuentes"><header><h2>De quien</h2><small class="nums">~${whitelist(c)} artistas</small></header>
    <div class="col-body scroll">
      <div class="box" data-n="Fuente Follows"><div class="fuente">${sw(c.follows, "follows", `${S.followed.size ? "" : "disabled"}`)}<div class="grow"><b>Artistas que seguis</b><br>
        <small>${S.followed.size ? `${S.followed.size} artistas. Si seguis a alguien nuevo, entra solo.` : `No seguis a nadie en Spotify. <button class="btn fantasma chico" data-act="inicio" style="padding:0;color:var(--verde)">Segui a tus mas escuchados</button>`}</small></div></div></div>
      <div class="stack" style="gap:6px" data-n="Lista de Seed Playlists"><div class="eyebrow" style="padding:4px 0">Tus playlists</div>${rows}</div>
      <div class="box" data-n="Artistas a mano"><b>A mano</b>
        <div class="chips">${c.manual.map(a => `<span class="chip" data-n="Ficha de artista">${avatar(a, 22)}${esc(a)}<button data-act="man-rm" data-a="${esc(a)}" aria-label="Quitar ${esc(a)}">&times;</button></span>`).join("") || `<small>Ninguno todavia.</small>`}</div>
        <input type="search" id="search" data-search="1" placeholder="Buscar un artista para sumar" autocomplete="off" data-n="Buscador de artistas"><div id="res"></div></div>
    </div></section>`;
}
function searchResults(q) {
  const c = cur(); q = q.trim().toLowerCase();
  if (!q) return "";
  const hits = ARTISTS.filter(a => a.toLowerCase().includes(q) && !c.manual.includes(a)).slice(0, 6);
  if (!hits.length) return `<small>No encontre "${esc(q)}".</small>`;
  return `<div class="results">${hits.map(a => `<button data-act="man-add" data-a="${esc(a)}">${avatar(a, 26)}${esc(a)}</button>`).join("")}</div>`;
}
function colReglas(c) {
  const bot = c.target.kind === "bot";
  const acum = c.retencion === "acum" || !bot;
  const weeks = Array.from({ length: 12 }, (_, i) => `<i class="${acum ? "acum" : i < c.retencion ? "on" : ""}"></i>`).join("");
  const list = PLAYLISTS.filter(p => p.tipo !== "ajena").map(p => {
    const other = S.canales.find(k => k.id !== c.id && k.target.pid === p.id);
    return `<button class="opt ${c.target.pid === p.id ? "on" : ""}" data-act="t-pick" data-p="${p.id}" ${other ? "disabled" : ""}>${cover(p.nombre, 30, hue(p.id))}<span class="grow ellip"><b>${esc(p.nombre)}</b></span><small class="nums">${other ? "en uso" : p.items}</small></button>`;
  }).join("");
  return `<section class="col" data-n="Columna Reglas"><header><h2>Donde y como</h2></header>
    <div class="col-body scroll">
      <div class="box" data-n="Editor de Playlist"><h3>Playlist</h3>
        <div class="seg" data-n="Selector de Target"><button class="${bot ? "on" : ""}" data-act="t-kind" data-k="bot">Nueva</button><button class="${bot ? "" : "on"}" data-act="t-kind" data-k="existing">Una mia</button></div>
        ${bot ? `<input type="text" id="tname" data-name="1" value="${esc(c.target.nombre)}" aria-label="Nombre de la playlist" data-n="Nombre de playlist"><small>La creamos en tu Spotify con este nombre.</small>`
          : `<div class="optlist scroll" data-n="Selector de playlist existente">${list}</div><small>Solo se agregan canciones; nunca se borra nada tuyo.</small>`}
        ${capMeter(c)}</div>
      <div class="box" data-n="Editor de Retencion"><h3>Cuanto guarda</h3>
        ${bot ? `<div class="seg" data-n="Selector de Retencion">${[1, 2, 4, 8, 12].map(n => `<button class="${c.retencion === n ? "on" : ""}" data-act="ret" data-r="${n}">${n === 1 ? "1 sem" : `${n} sem`}</button>`).join("")}<button class="${c.retencion === "acum" ? "on" : ""}" data-act="ret" data-r="acum">Todo</button></div>` : ""}
        <div class="weeks" data-n="Semanas">${weeks}</div>
        <small>${!bot ? "En una playlist tuya se guarda todo." : c.retencion === 1 ? "Cada semana se renueva entera." : c.retencion === "acum" ? "No se borra nada." : `Entra lo nuevo y sale lo de hace ${c.retencion} semanas.`}</small></div>
      <div class="box" data-n="Interruptor Guardado"><div class="fuente">${sw(c.guardado, "guardado")}<div class="grow"><b>Saltear lo que ya tengo</b><br><small>Si ya esta en tus likes o tus playlists, no se agrega.</small></div></div></div>
      <div class="box" data-n="Resumen de Canal"><h3>En una frase</h3><p class="muted" style="font-size:15px;line-height:1.5">Lo nuevo de <b style="color:var(--texto)" class="nums">~${whitelist(c)} artistas</b> va a <b style="color:var(--texto)">${esc(nombre(c))}</b>, ${retText(c)}${c.guardado ? " y saltea lo que ya tenes" : ""}.</p></div>
    </div></section>`;
}
function colPistas(c) {
  const inc = incluidos(c);
  const top = [...inc].map(a => [a, apar(a)]).sort((x, y) => y[1] - x[1]).slice(0, 10);
  const sug = ARTISTS.filter(a => !inc.has(a) && APAR[a] && PLAYLISTS.some(p => p.tipo !== "ajena" && p.top.includes(a)))
    .map(a => [a, apar(a), PLAYLISTS.filter(p => p.tipo !== "ajena" && p.top.includes(a)).map(p => p.nombre)]).sort((x, y) => y[1] - x[1]).slice(0, 8);
  const shared = S.canales.filter(k => k.id !== c.id).map(k => { const o = incluidos(k); return [nombre(k), [...inc].filter(a => o.has(a)).length]; });
  return `<section class="col" data-n="Columna Pistas"><header><h2>Pistas</h2><small>de tu biblioteca</small></header>
    <div class="col-body scroll">
      <div class="box" data-n="Quienes mas aparecen"><h3>Quienes pesan mas en este Canal</h3><small>Veces que aparecen en tus playlists.</small>
        ${top.length ? bars(top, top[0][1]) : `<small>Elegi alguna playlist o artista.</small>`}</div>
      <div class="box" data-n="Sugerencias"><h3>Te faltan en este Canal</h3><small>Estan en otras playlists tuyas.</small>
        <div>${sug.map(([a, v, pls]) => `<div class="sug" data-n="Fila de sugerencia">${avatar(a, 30)}<span class="grow"><b class="ellip" style="display:block">${esc(a)}</b><small class="ellip" style="display:block">en ${esc(pls.slice(0, 2).join(", "))}</small></span><button class="btn chico" data-act="man-add" data-a="${esc(a)}">Sumar</button></div>`).join("") || `<small>No hay nada que sugerir.</small>`}</div></div>
      ${shared.length ? `<div class="box" data-n="Cruce con otros Canales"><h3>Se cruza con</h3>${shared.map(([n, k]) => `<div class="row"><span class="grow ellip">${esc(n)}</span><small class="nums">${k} artistas en comun</small></div>`).join("")}</div>` : ""}
    </div></section>`;
}
function vCanal(c) {
  return `<main class="panel main" style="--h:${c.hue}" data-n="Panel">
    <div class="head" style="position:relative" data-n="Cabecera de Canal">${cover(nombre(c), 56, c.hue)}

        ${gem.map(g => { const a = P(g.a), bn = g.b ? P(g.b).nombre : g.bNombre, i = GEMELAS.indexOf(g); return `<div class="gemela" data-n="Tarjeta de gemelas">
          <div class="par"><div class="row">${cover(a.nombre, 34, hue(a.id))}<b class="ellip">${esc(a.nombre)}</b></div><span class="solape nums">${g.comp}/6</span><div class="row" style="justify-content:flex-end">${cover(bn, 34, hue(g.b || bn))}<b class="ellip">${esc(bn)}</b></div></div>

      </div></section>

const incluidosTodos = () => { const s = new Set(); S.canales.forEach(c => incluidos(c).forEach(a => s.add(a))); return s; };

    <ol class="pasos" data-n="Pasos de Own App">
      <li><div>Entra a <b>developer.spotify.com/dashboard</b> con tu cuenta y toca <b>Create app</b>.</div></li>
      <li><div>En <b>Redirect URIs</b> pega exactamente esto:<div class="copybox" data-n="Caja de redirect"><code id="redir">${REDIRECT}</code><button class="btn chico" data-act="copy">Copiar</button></div></div></li>
      <li><div>En <b>Which API/SDKs</b> marca <b>Web API</b> y guarda.</div></li>
      <li><div>En <b>Settings &rsaquo; User Management</b> agrega tu propio email de Spotify.</div></li>
      <li><div class="stack">Pega el <b>Client ID</b> y el <b>Client secret</b>:
        <div class="claves" data-n="Formulario de claves"><div><label for="own-cid"><small>Client ID</small></label><input type="text" id="own-cid" data-own="cid" value="${esc(o.cid)}" class="mono"></div>
          <div><label for="own-sec"><small>Client secret</small></label><input type="password" id="own-sec" data-own="secret" value="${esc(o.secret)}" class="mono"></div></div></div></li></ol>
    <div class="aviso warn" data-n="Aviso Premium">Necesitas <b>Spotify Premium</b>: Spotify apaga las apps cuyo dueno no lo tiene.</div>
    <div id="own-err"></div>
    <div class="row wrap"><button class="btn primario grande" data-act="login-own" data-n="Boton Conectar">Conectar con Spotify</button><button class="btn fantasma" data-act="back">Volver</button></div></div>`;
}

// ---------- render ----------
function proto() {
  const sim = !S.user ? `<span class="proto-sep"></span><button class="${S.sim === "registrado" ? "on" : ""}" data-act="sim" data-s="registrado">Registrado</button><button class="${S.sim === "nuevo" ? "on" : ""}" data-act="sim" data-s="nuevo">No registrado</button>` : "";
  return `<span style="padding:0 8px;font-weight:700">Prototipo</span><span class="proto-sep"></span><button class="${S.ui.names ? "on" : ""}" data-act="names">Nombres</button><button class="${S.ui.debug ? "on" : ""}" data-act="debug">Estado</button>${S.user ? `<button data-act="logout">Ver login</button>` : ""}${sim}`;
}
function keepScroll(fn) {
  const pos = [...document.querySelectorAll("#app .scroll")].map(e => e.scrollTop);
  fn();
  document.querySelectorAll("#app .scroll").forEach((e, i) => { if (pos[i] != null) e.scrollTop = pos[i]; });
}
function render() {
  keepScroll(() => {
    let html;
    if (!S.user) html = vLogin();
    else { const c = cur(); html = `<div class="shell">${side()}${S.ui.view === "inicio" || !c ? vInicio() : vCanal(c)}</div>`; }
    document.getElementById("app").innerHTML = html;
    document.getElementById("app").style.height = "100%";
  });
  document.getElementById("proto").innerHTML = proto();
  document.body.classList.toggle("names", S.ui.names);
  const dbg = document.getElementById("debug");
  dbg.hidden = !S.ui.debug;
  if (S.ui.debug) dbg.textContent = JSON.stringify({ user: !!S.user, followed: [...S.followed], canales: S.canales.map(c => ({ ...c, whitelist: whitelist(c) })) }, null, 2);
  S.ui.flash = null;
  hideNames();
}

// ---------- Nombres ----------
const nhl = document.getElementById("nhl"), ntip = document.getElementById("ntip");
function hideNames() { nhl.hidden = true; ntip.hidden = true; }
function pathOf(el) { const p = []; for (let e = el; e; e = e.parentElement?.closest("[data-n]")) p.unshift(e.dataset.n); return p; }
document.addEventListener("mouseover", e => {
  if (!S.ui.names) return;
  const el = e.target.closest("[data-n]");
  if (!el) return hideNames();
  const r = el.getBoundingClientRect();
  Object.assign(nhl.style, { left: r.left - 2 + "px", top: r.top - 2 + "px", width: r.width + 4 + "px", height: r.height + 4 + "px" });
  nhl.firstChild.textContent = el.dataset.n; nhl.hidden = false;
  ntip.textContent = pathOf(el).join("  ›  "); ntip.hidden = false;
});
document.addEventListener("scroll", () => { if (S.ui.names) hideNames(); }, true);

// ---------- acciones ----------
function newCanal() {
  const c = { id: "c" + seq++, hue: (seq * 67) % 360, follows: false, seeds: [], excl: {}, manual: [], target: { kind: "bot", nombre: "Canal " + (S.canales.length + 1) }, items: 0, retencion: 4, guardado: true };
  S.canales.push(c); S.ui.sel = c.id; S.ui.view = "canal";
}
document.addEventListener("click", e => {
  if (S.ui.names && !e.target.closest(".proto")) {
    const el = e.target.closest("[data-n]");
    if (el) { e.preventDefault(); try { navigator.clipboard.writeText(el.dataset.n).catch(() => {}); } catch (x) {} ntip.textContent = `Copiado: ${el.dataset.n}`; ntip.hidden = false; return; }
  }
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const d = el.dataset, c = cur();
  switch (d.act) {
    case "names": S.ui.names = !S.ui.names; break;
    case "debug": S.ui.debug = !S.ui.debug; break;
    case "sim": S.sim = d.s; S.screen = "login"; break;
    case "logout": S.user = null; S.screen = "login"; S.ui.confirm = false; break;
    case "login": if (S.sim === "registrado") { S.user = PERFIL; S.ui.flash = "Conectado."; } else S.screen = "alta"; break;
    case "back": S.screen = "login"; break;
    case "login-own":
      if (!S.own.cid.trim() || !S.own.secret.trim()) { document.getElementById("own-err").innerHTML = `<div class="aviso crit">Pega el Client ID y el Client secret para seguir.</div>`; return; }
      S.user = PERFIL; S.screen = "login"; S.ui.flash = "Conectado con tu propia app."; break;
    case "copy": try { navigator.clipboard.writeText(REDIRECT).then(() => { el.textContent = "Copiado"; }, selectRedir); } catch (x) { selectRedir(); } return;
    case "inicio": S.ui.view = "inicio"; S.ui.confirm = false; break;
    case "sel": S.ui.sel = d.c; S.ui.view = "canal"; S.ui.confirm = false; break;
    case "new": newCanal(); break;
    case "expand": S.ui.open.has(d.p) ? S.ui.open.delete(d.p) : S.ui.open.add(d.p); break;
    case "seed":
      if (c.seeds.some(s => s.pid === d.p)) c.seeds = c.seeds.filter(s => s.pid !== d.p);
      else { c.seeds.push({ pid: d.p, feats: false }); S.ui.open.add(d.p); }
      break;
    case "feats": { const s = c.seeds.find(s => s.pid === d.p); s.feats = !s.feats; break; }
    case "excl": { const l = c.excl[d.p] || (c.excl[d.p] = []); const i = l.indexOf(d.a); i >= 0 ? l.splice(i, 1) : l.push(d.a); break; }
    case "follows": c.follows = !c.follows; break;
    case "man-add": if (!c.manual.includes(d.a)) c.manual.push(d.a); break;
    case "man-rm": c.manual = c.manual.filter(x => x !== d.a); break;
    case "t-kind":
      if (d.k === c.target.kind) return;
      if (d.k === "bot") { c.target = { kind: "bot", nombre: "Canal nuevo" }; c.items = 0; if (c.retencion === "acum") c.retencion = 4; }
      else { const p = PLAYLISTS.find(p => p.tipo !== "ajena" && !S.canales.some(k => k.target.pid === p.id)); if (!p) return; c.target = { kind: "existing", pid: p.id, nombre: p.nombre }; c.retencion = "acum"; }
      break;
    case "t-pick": c.target = { kind: "existing", pid: d.p, nombre: P(d.p).nombre }; break;
    case "ret": c.retencion = d.r === "acum" ? "acum" : Number(d.r); break;
    case "guardado": c.guardado = !c.guardado; break;
    case "ask-unlink": S.ui.confirm = true; break;
    case "cancel": S.ui.confirm = false; break;
    case "unlink": {
      const n = nombre(c);
      S.canales = S.canales.filter(k => k.id !== c.id); S.ui.confirm = false; S.ui.sel = S.canales[0]?.id; if (!S.ui.sel) S.ui.view = "inicio";
      S.ui.flash = d.del === "1" ? `"${n}" borrado junto con su playlist.` : `"${n}" borrado. La playlist sigue en tu Spotify.`;
      break;
    }
    case "follow": S.followed.add(d.a); break;
    case "follow-all": Object.entries(APAR).sort((a, b) => b[1] - a[1]).slice(0, 8).forEach(([a]) => S.followed.add(a)); S.ui.flash = "Listo, ya los seguis en Spotify."; break;
    case "merge": S.hidden.add(Number(d.g)); S.ui.flash = "Prototipo: aca te mostrariamos la playlist unida antes de crearla."; break;
    case "hide": S.hidden.add(Number(d.g)); break;
    default: return;
  }
  render();
});
document.addEventListener("input", e => {
  const el = e.target, d = el.dataset;
  if (d.search) document.getElementById("res").innerHTML = searchResults(el.value);
  if (d.name) { cur().target.nombre = el.value; }
  if (d.own) S.own[d.own] = el.value;
});
document.addEventListener("change", e => { if (e.target.dataset.name) render(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.ui.confirm) { S.ui.confirm = false; render(); return; }
  if (e.target.closest("input, textarea, select, [contenteditable]")) return;
  if (e.key === "n" || e.key === "N") { S.ui.names = !S.ui.names; render(); }
});
function selectRedir() { const r = document.createRange(); r.selectNodeContents(document.getElementById("redir")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

// Canales armados con tus playlists
S.canales = [
  { id: "c1", hue: 322, follows: false, seeds: [{ pid: "p7", feats: true }, { pid: "p6", feats: false }], excl: { p6: ["Alex Rose"] }, manual: ["Duki", "YSY A"],
    target: { kind: "bot", nombre: "Radar Trap" }, items: 212, retencion: 4, guardado: true },
  { id: "c2", hue: 28, follows: false, seeds: [{ pid: "p12", feats: false }, { pid: "p13", feats: false }], excl: {}, manual: ["Romeo Santos"],
    target: { kind: "existing", pid: "p11", nombre: "Oldie but Goldie" }, items: 0, retencion: "acum", guardado: false },
];
render();
</script>
