<title>Radar de Viernes</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  PROTOTIPO descartable (#7). Tres variantes de la UI de configuracion, switchables con la
  barra de abajo o con las flechas del teclado (hash #A / #B / #C). Estado en memoria, datos
  de ejemplo, sin backend. Abrir con doble click.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #F2F4F1; --surface: #FFFFFF; --surface2: #E7EBE6; --ink: #17201B; --muted: #5A655E;
  --line: #D3D9D2; --accent: #2B4FD6; --accent-ink: #FFFFFF; --accent-soft: #E2E8FC;
  --ok: #247548; --ok-soft: #DDF0E4; --warn: #9A600C; --warn-soft: #F8EBD3; --crit: #B42318; --crit-soft: #FBE1DE;
  --bar: #17201B; --bar-ink: #F2F4F1;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #101512; --surface: #19201B; --surface2: #232B25; --ink: #E6ECE7; --muted: #99A49D;
    --line: #313A33; --accent: #93A8FF; --accent-ink: #0C1333; --accent-soft: #222B52;
    --ok: #62C98E; --ok-soft: #173424; --warn: #E3A64D; --warn-soft: #3A2A12; --crit: #F2806F; --crit-soft: #3D1A16;
    --bar: #E6ECE7; --bar-ink: #101512;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #101512; --surface: #19201B; --surface2: #232B25; --ink: #E6ECE7; --muted: #99A49D;
  --line: #313A33; --accent: #93A8FF; --accent-ink: #0C1333; --accent-soft: #222B52;
  --ok: #62C98E; --ok-soft: #173424; --warn: #E3A64D; --warn-soft: #3A2A12; --crit: #F2806F; --crit-soft: #3D1A16;
  --bar: #E6ECE7; --bar-ink: #101512;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); padding: 0 16px 120px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 21px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 700; }
p { margin: 0; }
small, .muted { color: var(--muted); }
small { font-size: 13px; }
.mono { font-family: var(--mono); font-size: 13px; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--crit); }
.btn.link { border: 0; background: none; padding: 4px 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
input[type=text], input[type=password], select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
input[type=checkbox], input[type=radio] { accent-color: var(--accent); width: 17px; height: 17px; margin: 2px 0 0; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--surface2); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.note { border-radius: 8px; padding: 10px 12px; font-size: 14px; background: var(--surface2); }
.note.warn { background: var(--warn-soft); }
.note.crit { background: var(--crit-soft); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: flex-start; }
.row.center { align-items: center; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.nums { font-variant-numeric: tabular-nums; }

/* editores compartidos */
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); }
.opt:last-child { border-bottom: 0; }
.opt.off { color: var(--muted); }
.opt label { cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; gap: 6px; align-items: center; background: var(--accent-soft); color: var(--accent); border-radius: 99px; padding: 3px 4px 3px 10px; font-size: 14px; font-weight: 500; }
.chip button { border: 0; background: none; color: inherit; padding: 0 6px; font-size: 15px; line-height: 1; }
.results { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.results button { border: 0; border-bottom: 1px solid var(--line); background: var(--surface); text-align: left; padding: 7px 10px; }
.results button:last-child { border-bottom: 0; }
.results button:hover { background: var(--surface2); }
.meter { height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.meter.warn i { background: var(--warn); }
.meter.crit i { background: var(--crit); }
.tracks { list-style: none; margin: 0; padding: 0; font-size: 14px; }
.tracks li { padding: 5px 0; border-bottom: 1px dashed var(--line); display: flex; gap: 8px; }
.tracks li:last-child { border-bottom: 0; }
.confirm { border: 1px solid var(--crit); border-radius: 10px; padding: 14px; background: var(--crit-soft); }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
.copybox { display: flex; gap: 8px; align-items: center; background: var(--surface2); border-radius: 8px; padding: 6px 6px 6px 10px; overflow-x: auto; }
.copybox code { font-family: var(--mono); font-size: 13px; white-space: nowrap; flex: 1; }

/* ---------- A: Asistente ---------- */
.a { max-width: 640px; margin: 0 auto; padding-block: 28px; display: flex; flex-direction: column; gap: 22px; }
.a-hero { background: var(--accent); color: var(--accent-ink); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 4px; }
.a-hero .big { font-family: var(--display); font-size: 34px; font-weight: 800; line-height: 1.05; }
.a-list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.a-item { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.a-item:last-child { border-bottom: 0; }
.a-progress { display: flex; gap: 6px; }
.a-progress i { flex: 1; height: 4px; border-radius: 99px; background: var(--line); }
.a-progress i.on { background: var(--accent); }
.a-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.a-nav { display: flex; justify-content: space-between; gap: 10px; }
.a-choice { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.a-tile { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.a-tile.on { border-color: var(--accent); }
.a-review dt { font-weight: 600; margin-top: 10px; }
.a-review dd { margin: 0; color: var(--muted); }

/* ---------- B: Panel ---------- */
.b { display: grid; grid-template-columns: 250px 1fr; gap: 20px; max-width: 1180px; margin: 0 auto; padding-block: 20px; align-items: start; }
.b-side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: flex; flex-direction: column; gap: 14px; }
.b-who { display: flex; flex-direction: column; gap: 2px; }
.b-nav { display: flex; flex-direction: column; gap: 2px; }
.b-nav button { display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 0; background: none; text-align: left; padding: 9px 10px; border-radius: 8px; font-weight: 500; }
.b-nav button:hover { background: var(--surface2); }
.b-nav button.on { background: var(--surface); box-shadow: inset 3px 0 0 var(--accent); }
.b-main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.b-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.b-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; align-items: start; }
.b-sec { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.b-col { display: flex; flex-direction: column; gap: 16px; }
.b-login { max-width: 980px; margin: 0 auto; padding-block: 32px; display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; align-items: start; }
@media (max-width: 820px) {
  .b, .b-login, .b-grid { grid-template-columns: 1fr; }
  .b-side { position: static; }
  .b-nav { flex-direction: row; overflow-x: auto; }
  .b-nav button { white-space: nowrap; }
  .b-nav button.on { box-shadow: inset 0 -3px 0 var(--accent); }
}

/* ---------- C: Frase ---------- */
.c { max-width: 760px; margin: 0 auto; padding-block: 36px; display: flex; flex-direction: column; gap: 34px; }
.c-lead { font-family: var(--display); font-size: 19px; color: var(--muted); font-weight: 500; }
.c-lead b { color: var(--ink); }
.c-canal { display: flex; flex-direction: column; gap: 12px; padding-top: 22px; border-top: 1px solid var(--line); }
.c-sentence { font-family: var(--display); font-size: 27px; font-weight: 500; line-height: 1.5; letter-spacing: -0.01em; }
.c-tok { font: inherit; font-weight: 700; color: var(--accent); background: none; border: 0; padding: 0 2px; border-bottom: 2px dotted var(--accent); border-radius: 0; }
.c-tok.on { background: var(--accent-soft); border-bottom-style: solid; }
.c-edit { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.c-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 14px; color: var(--muted); align-items: center; }
@media (max-width: 520px) { .c-sentence { font-size: 22px; } }

/* ---------- barra del prototipo ---------- */
.proto { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); z-index: 10; max-width: calc(100% - 16px); }
.proto-in { display: flex; align-items: center; gap: 4px; background: var(--bar); color: var(--bar-ink); border-radius: 99px; padding: 5px; box-shadow: 0 6px 24px rgba(0,0,0,.25); font-size: 13px; }
.proto-in button { border: 0; background: none; color: inherit; border-radius: 99px; padding: 6px 10px; white-space: nowrap; }
.proto-in button:hover { background: color-mix(in srgb, var(--bar-ink) 15%, transparent); }
.proto-in .lbl { font-weight: 600; padding: 0 6px; white-space: nowrap; }
.proto-sep { width: 1px; align-self: stretch; background: color-mix(in srgb, var(--bar-ink) 25%, transparent); margin: 4px 2px; }
.debug { position: fixed; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); width: min(420px, calc(100% - 24px)); max-height: 55vh; overflow: auto; background: var(--bar); color: var(--bar-ink); border-radius: 12px; padding: 12px; font: 12px/1.45 var(--mono); white-space: pre; z-index: 9; }
@media (max-width: 520px) { .proto-in .hide-sm { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app"></div>
<div id="debug" class="debug" hidden></div>
<div class="proto"><div class="proto-in">
  <button data-act="v-prev" aria-label="Variante anterior">&larr;</button>
  <span class="lbl" id="vlabel"></span>
  <button data-act="v-next" aria-label="Variante siguiente">&rarr;</button>
  <span class="proto-sep"></span>
  <button data-act="debug">Estado</button>
  <button data-act="logout" class="hide-sm" id="loginbtn">Ver login</button>
</div></div>

<script>
// ---------- datos de ejemplo ----------
const FOLLOWS = 87;
const REDIRECT = "https://spotify-new-releases.onrender.com/callback";
const PLAYLISTS = [
  { id: "p1", nombre: "Rock argentino que no falla", tipo: "propia", artistas: 34, feats: 11, items: 412 },
  { id: "p2", nombre: "Viaje a la costa", tipo: "propia", artistas: 58, feats: 23, items: 690 },
  { id: "p3", nombre: "Previa con los pibes", tipo: "colaborativa", artistas: 41, feats: 19, items: 233 },
  { id: "p4", nombre: "Todo lo que escuche en 2025", tipo: "propia", artistas: 212, feats: 64, items: 9180 },
  { id: "p5", nombre: "Indie en espanol", tipo: "ajena", artistas: 70, feats: 12, items: 150 },
  { id: "p6", nombre: "Novedades Viernes", tipo: "editorial", artistas: 90, feats: 40, items: 100 },
];
const ARTISTS = ["Babasonicos","Bandalos Chinos","Conociendo Rusia","Dillom","El Mato a un Policia Motorizado","Emilia","Fito Paez","Francisca y los Exploradores","Juana Molina","Lali","Los Espiritus","Marilina Bertoldi","Nathy Peluso","Nicki Nicole","Paco Amoroso","Ca7riel","Peces Raros","Silvestre y la Naranja","Tan Bionica","Wos","Zoe Gotusso"].map((n, i) => ({ id: "a" + i, nombre: n }));
const RUN = { cuando: "hoy, 02:41", ok: true, artistas: 143, nuevos: 9, requests: 318 };

let seq = 3;
const S = {
  conn: { modo: "own", nombre: "Luca", email: "luca@ejemplo.com" },
  canales: [
    { id: "c1", follows: true, seeds: [{ pid: "p1", feats: false }], manual: ["a11", "a16"],
      target: { kind: "bot", nombre: "Radar rock" }, items: 640, retencion: 4, guardado: true,
      pend: [["Marilina Bertoldi","Mi Fiesta","Para Quien Trabajas II"],["Peces Raros","Lo Que Queda","Lo Que Queda"],["Babasonicos","Tormento","Tormento"],["Los Espiritus","Rio Arriba","Rio Arriba"]],
      entrega: { cuando: "vie 18 sep", ok: true, ins: 23, ret: 18 } },
    { id: "c2", follows: false, seeds: [{ pid: "p3", feats: true }], manual: ["a13", "a18"],
      target: { kind: "existing", pid: "p4", nombre: "Todo lo que escuche en 2025" }, items: 9180, retencion: "acum", guardado: false,
      pend: [["Nicki Nicole","Dispara","Dispara"],["Paco Amoroso","Tu Madre","Tu Madre (feat. Ca7riel)"]],
      entrega: { cuando: "vie 18 sep", ok: false, ins: 7, ret: 0, error: "Spotify respondio 502 en el Track 8 de 15. Se reintenta manana." } },
  ],
  ui: { v: "A", debug: false, login: null, own: { cid: "", secret: "" }, confirm: null, flash: null,
        A: { screen: "home", step: 0, cid: null }, B: { cid: "c1" }, C: { open: null } },
};
const VARIANTS = { A: "Asistente", B: "Panel", C: "Frase" };

// ---------- helpers ----------
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const P = id => PLAYLISTS.find(p => p.id === id);
const A = id => ARTISTS.find(a => a.id === id);
const C = id => S.canales.find(c => c.id === id);
const nombre = c => c.target.nombre || "Sin nombre";
function whitelist(c) {
  let n = c.follows ? FOLLOWS : 0;
  c.seeds.forEach(s => { const p = P(s.pid); n += p.artistas + (s.feats ? p.feats : 0); });
  return n + c.manual.length;
}
function retText(c) {
  if (c.target.kind === "existing" || c.retencion === "acum") return "todo, nunca retiro";
  return c.retencion === 1 ? "solo la ultima semana" : `las ultimas ${c.retencion} semanas`;
}
function nextFriday() {
  const d = new Date(); const add = (5 - d.getDay() + 7) % 7; d.setDate(d.getDate() + add);
  // 02:37 ART = 05:37 UTC
  return new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), 5, 37));
}
const FRI = nextFriday();
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
const friDay = FRI.toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" });
const friTime = FRI.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
const cap = c => c.target.kind === "existing" ? P(c.target.pid).items : c.items;
function capMeter(c) {
  const n = cap(c), pct = Math.min(100, n / 100);
  const cls = pct >= 95 ? "crit" : pct >= 90 ? "warn" : "";
  const msg = pct >= 95 ? `Casi llena: ${n} de 10.000. Spotify no deja pasar de 10.000; lo que no entre se descarta.`
    : pct >= 90 ? `${n} de 10.000 Tracks (${Math.round(pct)}%). Se esta llenando.` : `${n} de 10.000 Tracks`;
  return `<div class="stack" style="gap:6px"><div class="meter ${cls}"><i style="width:${pct}%"></i></div><small class="nums">${msg}</small></div>`;
}
const pendPill = c => c.pend.length ? `<span class="pill accent nums">${c.pend.length} esperando</span>` : `<span class="pill">nada nuevo aun</span>`;
const entregaPill = c => !c.entrega ? `<span class="pill">sin Entregas</span>` : c.entrega.ok ? `<span class="pill ok">Entrega ok</span>` : `<span class="pill crit">Entrega fallo</span>`;

// ---------- editores compartidos ----------
function edSources(c) {
  const seedRows = PLAYLISTS.map(p => {
    const ok = p.tipo === "propia" || p.tipo === "colaborativa";
    const s = c.seeds.find(x => x.pid === p.id);
    const isTarget = S.canales.some(k => k.target.pid === p.id);
    return `<div class="opt ${ok ? "" : "off"}">
      <input type="checkbox" id="seed-${c.id}-${p.id}" data-act="seed" data-c="${c.id}" data-p="${p.id}" ${s ? "checked" : ""} ${ok ? "" : "disabled"}>
      <div class="grow"><label for="seed-${c.id}-${p.id}">${esc(p.nombre)}</label>
        <div class="row wrap center" style="gap:6px"><span class="pill">${p.tipo}</span><small class="nums">${p.artistas} artistas</small>
        ${ok ? "" : `<small>No sirve: Spotify solo deja leer playlists tuyas o colaborativas.</small>`}
        ${isTarget ? `<small>Es la playlist de un Canal: sus artistas crecen solos.</small>` : ""}</div>
        ${s ? `<label class="row center" style="gap:6px;margin-top:4px"><input type="checkbox" id="feat-${c.id}-${p.id}" data-act="feats" data-c="${c.id}" data-p="${p.id}" ${s.feats ? "checked" : ""}><small>Sumar tambien los invitados (feats), +${p.feats} artistas</small></label>` : ""}
      </div></div>`;
  }).join("");
  return `<div class="stack">
    <div class="opt"><input type="checkbox" id="fol-${c.id}" data-act="follows" data-c="${c.id}" ${c.follows ? "checked" : ""}>
      <div class="grow"><label for="fol-${c.id}"><b>Artistas que seguis en Spotify</b></label><br><small class="nums">${FOLLOWS} artistas. Si seguis a alguien nuevo, entra solo.</small></div></div>
    <div><div class="eyebrow">Desde tus playlists</div>${seedRows}</div>
    <div class="stack" style="gap:8px"><div class="eyebrow">A mano</div>
      <div class="chips">${c.manual.map(id => `<span class="chip">${esc(A(id).nombre)}<button data-act="man-rm" data-c="${c.id}" data-a="${id}" aria-label="Quitar ${esc(A(id).nombre)}">&times;</button></span>`).join("") || `<small>Ninguno todavia.</small>`}</div>
      <input type="text" id="search-${c.id}" data-search="${c.id}" placeholder="Buscar un artista para sumar..." autocomplete="off">
      <div id="res-${c.id}"></div></div>
    <div class="note nums">Total: <b>~${whitelist(c)} artistas</b> vigilados en este Canal. Solo cuenta el artista principal de cada tema${c.seeds.some(s => s.feats) ? ", mas los feats donde lo pediste" : ""}.</div>
  </div>`;
}
function searchResults(cid, q) {
  const c = C(cid); q = q.trim().toLowerCase();
  if (!q) return "";
  const hits = ARTISTS.filter(a => a.nombre.toLowerCase().includes(q) && !c.manual.includes(a.id)).slice(0, 5);
  if (!hits.length) return `<small>No encontre "${esc(q)}" en Spotify.</small>`;
  return `<div class="results">${hits.map(a => `<button data-act="man-add" data-c="${cid}" data-a="${a.id}">+ ${esc(a.nombre)}</button>`).join("")}</div>`;
}
function edTarget(c) {
  const bot = c.target.kind === "bot";
  const own = PLAYLISTS.filter(p => p.tipo === "propia" || p.tipo === "colaborativa");
  const list = own.map(p => {
    const other = S.canales.find(k => k.id !== c.id && k.target.pid === p.id);
    return `<div class="opt ${other ? "off" : ""}"><input type="radio" name="tp-${c.id}" id="tp-${c.id}-${p.id}" data-act="t-pick" data-c="${c.id}" data-p="${p.id}" ${c.target.pid === p.id ? "checked" : ""} ${other ? "disabled" : ""}>
      <div class="grow"><label for="tp-${c.id}-${p.id}">${esc(p.nombre)}</label><br><small class="nums">${p.items} Tracks${other ? ` &middot; ya es la playlist de "${esc(nombre(other))}"` : ""}</small></div></div>`;
  }).join("");
  return `<div class="stack">
    <div class="opt"><input type="radio" name="tk-${c.id}" id="tk-${c.id}-bot" data-act="t-kind" data-c="${c.id}" data-k="bot" ${bot ? "checked" : ""}>

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.tagName === "SELECT") return;
  const d = el.dataset, c = d.c && C(d.c);
  switch (d.act) {
    case "v-prev": return cycle(-1);
    case "v-next": return cycle(1);
    case "debug": S.ui.debug = !S.ui.debug; break;
    case "logout":
      if (S.conn) { saved = S.conn; S.conn = null; S.ui.login = null; }
      else { S.conn = saved || { modo: "own", nombre: "Luca", email: "luca@ejemplo.com" }; }
      break;
    case "pick": S.ui.login = d.m; break;
    case "login-own":
      if (!S.ui.own.cid.trim() || !S.ui.own.secret.trim()) { S.ui.flash = null; alertInline("Pega el Client ID y el Client secret de tu app."); return; }
      S.conn = { modo: "own", nombre: "Luca", email: "luca@ejemplo.com" }; S.ui.flash = "Conectado con tu propia app. (Prototipo: no se llamo a Spotify.)"; break;
    case "login-shared": S.conn = { modo: "shared", nombre: "Luca", email: "luca@ejemplo.com" }; S.ui.flash = "Conectado con la app de Luca. (Prototipo: no se llamo a Spotify.)"; break;
    case "copy": {
      const t = REDIRECT;
      try { navigator.clipboard.writeText(t).then(() => { el.textContent = "Copiado"; }, () => selectRedir()); } catch (x) { selectRedir(); }
      return;
    }
    case "follows": c.follows = el.checked; break;
    case "seed": if (el.checked) c.seeds.push({ pid: d.p, feats: false }); else c.seeds = c.seeds.filter(s => s.pid !== d.p); break;
    case "feats": c.seeds.find(s => s.pid === d.p).feats = el.checked; break;
    case "man-add": c.manual.push(d.a); break;
    case "man-rm": c.manual = c.manual.filter(x => x !== d.a); break;
    case "t-kind":
      if (d.k === c.target.kind) return;
      if (d.k === "bot") { c.target = { kind: "bot", nombre: c.target.kind === "bot" ? c.target.nombre : "Canal nuevo" }; c.items = 0; if (c.retencion === "acum") c.retencion = 4; }
      else { const p = PLAYLISTS.find(p => (p.tipo === "propia" || p.tipo === "colaborativa") && !S.canales.some(k => k.target.pid === p.id)); c.target = { kind: "existing", pid: p.id, nombre: p.nombre }; c.retencion = "acum"; }
      break;
    case "t-pick": c.target = { kind: "existing", pid: d.p, nombre: P(d.p).nombre }; c.retencion = "acum"; break;
    case "guardado": c.guardado = el.checked; break;
    case "new": newCanal(); break;
    case "ask-unlink": S.ui.confirm = d.c; break;
    case "cancel": S.ui.confirm = null; break;
    case "unlink": {
      const n = nombre(c);
      S.canales = S.canales.filter(k => k.id !== d.c); S.ui.confirm = null; S.ui.A = { screen: "home", step: 0, cid: null };

      S.ui.flash = d.del === "1" ? `Canal "${n}" borrado junto con su playlist.` : `Canal "${n}" borrado. La playlist sigue en tu Spotify.`;
      break;
    }
    case "a-open": S.ui.A = { screen: "wizard", step: 0, cid: d.c }; break;
    case "a-home": S.ui.A = { screen: "home", step: 0, cid: null }; S.ui.confirm = null; break;
    case "a-step": S.ui.A.step = Math.max(0, Math.min(3, S.ui.A.step + Number(d.d))); window.scrollTo(0, 0); break;
    case "b-sel": S.ui.B.cid = d.c; S.ui.confirm = null; break;

    case "c-close": S.ui.C.open = null; break;

document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.act === "ret") { const c = C(el.dataset.c); c.retencion = el.value === "acum" ? "acum" : Number(el.value); render(); }
});
document.addEventListener("input", e => {
  const el = e.target, d = el.dataset;
  if (d.search) document.getElementById("res-" + d.search).innerHTML = searchResults(d.search, el.value);
  if (d.name) C(d.name).target.nombre = el.value;
  if (d.own) S.ui.own[d.own] = el.value;
});
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea, select, [contenteditable]")) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});
function selectRedir() { const r = document.createRange(); r.selectNodeContents(document.getElementById("redir")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
function alertInline(msg) {
  const b = document.querySelector('[data-act="login-own"]');
  let n = document.getElementById("own-err");
  if (!n) { n = document.createElement("div"); n.id = "own-err"; n.className = "note crit"; b.before(n); }
  n.textContent = msg;
}

const h = (location.hash || "").slice(1).toUpperCase();
if (VARIANTS[h]) S.ui.v = h;
else { const q = new URLSearchParams(location.search).get("variant"); if (q && VARIANTS[q.toUpperCase()]) S.ui.v = q.toUpperCase(); }
render();
</script>
